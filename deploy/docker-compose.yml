name: bambufarmer

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bambufarmer
      POSTGRES_PASSWORD: bambufarmer
      POSTGRES_DB: bambufarmer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bambufarmer"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: `docker compose --profile object up -d`
  # Image registries vary by environment; override image if pull fails.
  minio:
    profiles: ["object"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - miniodata:/data

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    environment:
      HTTP_ADDR: ":8080"
      AUTH_MODE: local_insecure
      DATABASE_URL: postgres://bambufarmer:bambufarmer@postgres:5432/bambufarmer?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  core:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: core
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://bambufarmer:bambufarmer@postgres:5432/bambufarmer?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports:
      - "18081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  edge:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: edge
    environment:
      HTTP_ADDR: ":8080"
      SITE_ID: default
      FARM_MODE: farm_manager
      FARM_MANAGER_TRANSPORT: cdp
      FARM_MANAGER_URL: ""
      REDIS_URL: redis://redis:6379/0
    ports:
      - "18082:8080"
    depends_on:
      redis:
        condition: service_healthy

  integrations:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: integrations
    environment:
      HTTP_ADDR: ":8080"
      SPOOLMAN_URL: ""
      MANYFOLD_URL: ""
    ports:
      - "18083:8080"

  analytics:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: analytics
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://bambufarmer:bambufarmer@postgres:5432/bambufarmer?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports:
      - "18084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: web
    environment:
      HTTP_ADDR: ":8080"
    ports:
      - "13000:8080"

volumes:
  pgdata:
  miniodata:
