# Podman-first compose (also works with Docker Compose v2).
#   podman compose -f deploy/compose.yml up -d --build
#   make up
#
# Each app service is a separate small image (one Go binary / distroless).
# Do not merge gateway/core/edge/web into a single container.

name: bambufarmer

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: bambufarmer
      POSTGRES_PASSWORD: bambufarmer
      POSTGRES_DB: bambufarmer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bambufarmer"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional object store: podman compose --profile object -f deploy/compose.yml up -d
  minio:
    profiles: ["object"]
    image: docker.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - miniodata:/data

  gateway:
    image: localhost/bambufarmer-gateway:dev
    build:
      context: ..
      dockerfile: services/gateway/Containerfile
    environment:
      HTTP_ADDR: ":8080"
      AUTH_MODE: lan
      CORE_URL: http://core:8080
      WEB_URL: http://web:8080
      ANALYTICS_URL: http://analytics:8080
      INTEGRATIONS_URL: http://integrations:8080
      EDGE_URL: http://edge:8080
      DATABASE_URL: postgres://bambufarmer:bambufarmer@postgres:5432/bambufarmer?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports:
      - "18080:8080"
    depends_on:
      - core
      - web
      - analytics
      - integrations
      - edge

  core:
    image: localhost/bambufarmer-core:dev
    build:
      context: ..
      dockerfile: services/core/Containerfile
    environment:
      HTTP_ADDR: ":8080"
      SITE_ID: default
      DATABASE_URL: postgres://bambufarmer:bambufarmer@postgres:5432/bambufarmer?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports:
      - "18081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  edge:
    image: localhost/bambufarmer-edge:dev
    build:
      context: ..
      dockerfile: services/edge/Containerfile
    environment:
      HTTP_ADDR: ":8080"
      SITE_ID: default
      FARM_MODE: farm_manager
      FARM_MANAGER_TRANSPORT: fm_native
      FARM_MANAGER_URL: ""
      REDIS_URL: redis://redis:6379/0
    ports:
      - "18082:8080"
    depends_on:
      redis:
        condition: service_healthy

  integrations:
    image: localhost/bambufarmer-integrations:dev
    build:
      context: ..
      dockerfile: services/integrations/Containerfile
    environment:
      HTTP_ADDR: ":8080"
      SPOOLMAN_URL: ""
      MANYFOLD_URL: ""
    ports:
      - "18083:8080"

  analytics:
    image: localhost/bambufarmer-analytics:dev
    build:
      context: ..
      dockerfile: services/analytics/Containerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://bambufarmer:bambufarmer@postgres:5432/bambufarmer?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports:
      - "18084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: localhost/bambufarmer-web:dev
    build:
      context: ..
      dockerfile: services/web/Containerfile
    environment:
      HTTP_ADDR: ":8080"
      PUBLIC_API_BASE: http://127.0.0.1:18080
    ports:
      - "13000:8080"

volumes:
  pgdata:
  miniodata:
