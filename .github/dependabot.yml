    labels: [dependencies, go]
    groups:
      go-services:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /services/analytics
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    groups:
      go-services:
