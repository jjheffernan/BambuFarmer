# Weekly dependency updates for Go modules and GitHub Actions.
# Each service/package has its own go.mod — list them explicitly.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  # Shared packages
  - package-ecosystem: gomod
    directory: /packages/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    groups:
      go-packages:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /packages/config
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    groups:
      go-packages:
        patterns: ["*"]

