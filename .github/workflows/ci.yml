name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.x"

jobs:
  go-test:
    name: Go test & vet
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - packages/api
          - packages/config
          - packages/db
          - packages/events
          - packages/farm
          - packages/httpserver
          - packages/printerstate
          - packages/version
          - services/gateway
          - services/core
          - services/edge
          - services/integrations
          - services/analytics
          - services/commerce
          - services/slicer
          - services/web
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            **/go.sum
            **/go.mod

      - name: Tidy
        run: go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # Proves the harness reports failures: intentional canary must fail under FORCE_TEST_FAIL=1.
  test-harness-force-fail:
    name: Force-fail canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            **/go.sum
            **/go.mod

      - name: Expect force-fail canary to fail
        working-directory: packages/config
        run: |
          set +e
          FORCE_TEST_FAIL=1 go test -count=1 -run TestForceFailCanary ./tests
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "force-fail canary passed unexpectedly — harness may not be detecting failures"
            exit 1
          fi
          echo "force-fail canary failed as expected (exit $code)"

  go-build:
    name: Go build services
    runs-on: ubuntu-latest
    needs: go-test
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - core
          - edge
          - integrations
          - analytics
          - commerce
          - slicer
          - web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            **/go.sum
            **/go.mod

      - name: Build ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        env:
          GOWORK: "off"
        run: |
          go mod tidy
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/bambufarmer-${{ matrix.service }} .

  images:
    name: Build module images
    runs-on: ubuntu-latest
    needs: go-build
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - core
          - edge
          - integrations
          - analytics
          - commerce
          - slicer
          - web
    steps:
      - uses: actions/checkout@v7

      # OCI Containerfiles; Docker on GITHUB_ACTIONS runners (Podman locally).
      - name: Build ${{ matrix.service }} image
        run: |
          docker build \
            -t bambufarmer-${{ matrix.service }}:ci \
            -f services/${{ matrix.service }}/Containerfile \
            .

  compose-config:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: |
          # compose services reference ../.env via env_file; CI has no secrets file
          cp .env.example .env
          docker compose -f deploy/compose.yml config --quiet

  changelog:
    name: Changelog shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require Keep a Changelog Unreleased
        run: |
          set -euo pipefail
          test -f CHANGELOG.md
          grep -qE '^## \[Unreleased\]' CHANGELOG.md
          grep -qE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md
          # VERSION file must be SemVer-ish
          grep -qE '^[0-9]+\.[0-9]+\.[0-9]+' VERSION
