name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.23.x"

jobs:
  go-test:
    name: Go test & vet
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - packages/api
          - packages/config
          - packages/events
          - packages/httpserver
          - services/gateway
          - services/core
          - services/edge
          - services/integrations
          - services/analytics
          - services/web
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            **/go.sum
            **/go.mod

      - name: Tidy
        run: go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  go-build:
    name: Go build services
    runs-on: ubuntu-latest
    needs: go-test
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - core
          - edge
          - integrations
          - analytics
          - web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            **/go.sum
            **/go.mod

      - name: Build ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        env:
          GOWORK: "off"
        run: |
          go mod tidy
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/bambufarmer-${{ matrix.service }} .

  images:
    name: Build module images
    runs-on: ubuntu-latest
    needs: go-build
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - core
          - edge
          - integrations
          - analytics
          - web
    steps:
      - uses: actions/checkout@v4

      # OCI Containerfiles; Docker on GITHUB_ACTIONS runners (Podman locally).
      - name: Build ${{ matrix.service }} image
        run: |
          docker build \
            -t bambufarmer-${{ matrix.service }}:ci \
            -f services/${{ matrix.service }}/Containerfile \
            .

  compose-config:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f deploy/compose.yml config --quiet
